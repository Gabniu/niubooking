# Booking reverse proxy for booking.niuautomations.com.
#
# Install the HTTP-only ACME block first, obtain the certificate with:
#   certbot certonly --webroot -w /var/www/certbot -d booking.niuautomations.com
# Then enable the HTTPS block and reload nginx.

server {
    listen 80;
    server_name booking.niuautomations.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name booking.niuautomations.com;

    ssl_certificate     /etc/letsencrypt/live/booking.niuautomations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.niuautomations.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
