<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Booking — Services</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="./src/styles.css" /><link rel="stylesheet" href="./src/styles-operations.css" /></head><body><main class="workspace studio-page services-page" data-services-page data-api-base="" data-tenant-id=""><header class="topbar"><div><p class="eyebrow">Catalog operations</p><h1>Services</h1><p class="intro-copy">Define the appointment and occurrence work your organization delivers.</p></div><a class="account-button" href="./index.html">Back to workspace</a></header><section class="communications-content"><div id="service-status" class="communication-status" role="status" aria-live="polite"></div><div class="service-workspace-grid"><article class="settings-card"><p class="eyebrow">New service</p><h2>Make work bookable</h2><form id="service-form" class="customer-form"><label class="field-label" for="service-name">Name</label><input id="service-name" required placeholder="Consultation" /><label class="field-label" for="service-description">Description</label><input id="service-description" placeholder="A short customer-facing summary" /><label class="field-label" for="service-mode">Booking mode</label><select id="service-mode"><option value="appointment">Appointment</option><option value="occurrence">Occurrence / class / trip</option></select><div class="service-form-grid"><label class="field-label" for="service-duration">Duration (min)<input id="service-duration" type="number" min="5" max="1440" step="1" required placeholder="30" /></label><label class="field-label" for="service-buffer-before">Before buffer<input id="service-buffer-before" type="number" min="0" max="1440" step="1" value="0" /></label><label class="field-label" for="service-buffer-after">After buffer<input id="service-buffer-after" type="number" min="0" max="1440" step="1" value="0" /></label></div><p class="settings-help">Industry packs can later add requirements, resources, and vocabulary without changing this catalog.</p><button class="primary-button" type="submit">Add service</button></form></article><article class="settings-card"><div class="settings-card-heading"><div><p class="eyebrow">Catalog</p><h2>Bookable services</h2></div><button id="refresh-services" class="account-button" type="button">Refresh</button></div><div id="service-list" class="service-list" aria-live="polite"></div></article></div></section></main><script type="module" src="./dist/services-page.js"></script></body></html>
