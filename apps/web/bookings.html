<!doctype html>
<!-- Ownership: authorized tenant schedule; no sample appointments are rendered. -->
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Booking — Schedule</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="./src/styles.css" /></head>
<body><main class="workspace studio-page bookings-page" data-bookings-page data-api-base="" data-tenant-id=""><header class="topbar"><div><p class="eyebrow">Appointment operations</p><h1>Schedule</h1><p class="intro-copy">Create and manage real appointments for the selected workspace.</p></div><a class="account-button" href="./index.html">Back to workspace</a></header><section class="communications-content"><div id="booking-status" class="communication-status" role="status" aria-live="polite"></div><div class="booking-workspace-grid"><article class="settings-card"><p class="eyebrow">New appointment</p><h2>Book a time</h2><form id="booking-form" class="customer-form"><label class="field-label" for="booking-customer">Customer profile</label><select id="booking-customer" required><option value="">Load customer profiles...</option></select><label class="field-label" for="booking-service">Service</label><input id="booking-service" required placeholder="Consultation" /><label class="field-label" for="booking-start">Starts</label><input id="booking-start" type="datetime-local" required /><label class="field-label" for="booking-end">Ends</label><input id="booking-end" type="datetime-local" required /><label class="field-label" for="booking-resources">Resources (optional)</label><select id="booking-resources" multiple aria-describedby="booking-resource-help"><option value="">Load resources...</option></select><small id="booking-resource-help" class="settings-help">Choose the room, instructor, vehicle, or other capacity required for this appointment.</small><button class="primary-button" type="submit">Create appointment</button></form></article><article class="settings-card"><div class="settings-card-heading"><div><p class="eyebrow">Tenant schedule</p><h2>Upcoming appointments</h2></div><button id="refresh-bookings" class="account-button" type="button">Refresh</button></div><div id="booking-list" class="booking-list" aria-live="polite"></div></article></div></section></main><script type="module" src="./dist/bookings-page.js"></script></body></html>
