<!doctype html>
<!-- Ownership: public single-purpose contact verification; no customer identity or destination is displayed. -->
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Booking — Verify contact</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="./src/styles.css" /></head>
<body><main class="workspace studio-page"><header class="topbar"><div><p class="eyebrow">Secure contact verification</p><h1>Confirm this contact method</h1><p class="intro-copy">Enter the six-digit code from your message. This link is short-lived and can only be used once.</p></div></header><section class="communications-content"><article class="settings-card verification-card"><div id="verification-status" class="communication-status" role="status" aria-live="polite"></div><label class="field-label" for="verification-code">Verification code</label><input id="verification-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" /><button id="verify-contact" class="primary-button" type="button">Verify contact method</button></article></section></main><script type="module" src="./dist/contact-verification-page.js"></script></body></html>
