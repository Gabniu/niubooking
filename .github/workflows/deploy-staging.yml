name: Deploy Booking staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: booking-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.BOOKING_STAGING_HOST }}
      STAGING_USER: ${{ secrets.BOOKING_STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.BOOKING_STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.BOOKING_STAGING_KNOWN_HOSTS }}
      STAGING_APP_DIR: ${{ secrets.BOOKING_STAGING_APP_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record exact release revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          requested_ref="${{ inputs.ref }}"
          if [[ "$requested_ref" =~ ^[0-9a-fA-F]{40}$ && "$actual_sha" != "$requested_ref" ]]; then
            echo "Checked out $actual_sha, but requested immutable revision $requested_ref" >&2
            exit 1
          fi
          echo "BOOKING_RELEASE_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "Deploying checked-out revision $actual_sha"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$STAGING_HOST" ]] || missing+=(BOOKING_STAGING_HOST)
          [[ -n "$STAGING_USER" ]] || missing+=(BOOKING_STAGING_USER)
          [[ -n "$STAGING_SSH_KEY" ]] || missing+=(BOOKING_STAGING_SSH_KEY)
          [[ -n "$STAGING_KNOWN_HOSTS" ]] || missing+=(BOOKING_STAGING_KNOWN_HOSTS)
          [[ -n "$STAGING_APP_DIR" ]] || missing+=(BOOKING_STAGING_APP_DIR)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Environment secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          case "$STAGING_APP_DIR" in
            /*) ;;
            *) echo "BOOKING_STAGING_APP_DIR must be an absolute server path" >&2; exit 1 ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/booking-staging"
          chmod 600 "$HOME/.ssh/booking-staging"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<EOF
          Host booking-staging
            HostName $STAGING_HOST
            User $STAGING_USER
            IdentityFile $HOME/.ssh/booking-staging
            IdentitiesOnly yes
          EOF

      - name: Transfer exact source revision
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' --exclude='./**/dist' \
            --exclude='./test-results' --exclude='./playwright-report' \
            --exclude='./graphify-out' --exclude='./.graphify-semantic' \
            --exclude='./.env' --exclude='./.env.*' \
            -czf "/tmp/booking-${BOOKING_RELEASE_SHA}.tgz" .
          scp "/tmp/booking-${BOOKING_RELEASE_SHA}.tgz" "booking-staging:/tmp/booking-${BOOKING_RELEASE_SHA}.tgz"

      - name: Deploy and smoke test on staging
        shell: bash
        run: |
          set -euo pipefail
          ssh booking-staging "BOOKING_RELEASE_SHA='$BOOKING_RELEASE_SHA' APP_DIR='$STAGING_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          release="$APP_DIR/releases/$BOOKING_RELEASE_SHA"
          mkdir -p "$release"
          tar -xzf "/tmp/booking-$BOOKING_RELEASE_SHA.tgz" -C "$release"
          rm -f "/tmp/booking-$BOOKING_RELEASE_SHA.tgz"
          test -f "$APP_DIR/.env"
          ln -sfn "$release" "$APP_DIR/current"
          cd "$APP_DIR/current"
          docker compose --project-name booking-staging --env-file "$APP_DIR/.env" -f infra/compose-booking-staging.yaml config >/dev/null
          docker compose --project-name booking-staging --env-file "$APP_DIR/.env" -f infra/compose-booking-staging.yaml up -d --build --remove-orphans
          curl --fail --silent --show-error http://127.0.0.1:3110/health/ready >/dev/null
          BOOKING_DEPLOYMENT_BASE_URL=http://127.0.0.1:3111 node scripts/check-deployed-web.mjs
          docker compose --project-name booking-staging --env-file "$APP_DIR/.env" -f infra/compose-booking-staging.yaml exec -T booking-worker node -e "fetch('http://127.0.0.1:3200/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          REMOTE
