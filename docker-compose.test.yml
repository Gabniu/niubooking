name: bookingapp-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookingapp_test
      POSTGRES_USER: bookingapp_test
      POSTGRES_PASSWORD: bookingapp_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookingapp_test -d bookingapp_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
